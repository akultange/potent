# Russian for src/content/people/lazare-londaridze.yaml. Projects are matched by their English name.
name: Лазаре Лондаридзе
title: Старший дизайнер интерфейсов и брендов
location: Тбилиси, Грузия
bio: >-
  Старший дизайнер интерфейсов и брендов, стратег. Вёл полный цикл дизайна системы для дилеров
  Yamaha Motor Europe (более 40 рынков, более 1 500 дилеров), а также проекты по управлению
  персоналом, платформу для авторов контента и лендинги.
projects:
  Yamaha Motor Europe CRM:
    name: CRM Yamaha Motor Europe
    type: Корпоративная система для дилеров
    sector: Мототехника
    summary: >-
      Единая система для более чем 1 500 официальных дилеров Yamaha на 40+ рынках Европы:
      коммерческие предложения, 3D-конфигуратор, управление складом и планирование работы.
    role: Полный цикл дизайна продукта — от исследования до поддержки после запуска, а также дизайн-система
  Egofy:
    type: Платформа управления персоналом
    sector: Управление персоналом
    summary: >-
      Платформа управления персоналом: прогнозы, графики смен, планирование загрузки, заявки и
      замены — в одной системе для разных стран и часовых поясов.
    role: >-
      Полный цикл дизайна продукта: графики, прогнозы, управление пользователями и правами —
      вплоть до спецификаций и передачи в разработку
  Seensme:
    type: Платформа для авторов (мобильная)
    sector: Авторский контент
    summary: >-
      Приложение, в котором авторы зарабатывают на контенте: подписки, платный просмотр и сообщения.
      Результаты: регистрацию завершают примерно на 40% чаще, настройка подписки стала на 70%
      быстрее, конверсия в платный просмотр выросла на 25%.
    role: Полный цикл дизайна продукта, а также бренд и визуальный стиль платформы
  Landing pages:
    name: Лендинги
    type: Продающие страницы
    summary: >-
      Продающие лендинги для разных отраслей, включая сервис для партнёрских программ:
      позиционирование, структура страницы, тексты и визуальный стиль.
  Atlantis Dental Clinic:
    type: Логотип и фирменный стиль
    sector: Медицина
    summary: >-
      Логотип, в котором силуэт зуба соединён с античным орнаментом «бегущая волна», вплетённым в
      его корень, — отсылка к греческому происхождению названия Atlantis.
